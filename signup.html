<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="loginstyles.css">
    <meta charset="UTF-8"> 
    <meta http-equiv="X-UA-COMPATIBLE" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VU-Login</title> 

   
</head>


<body>
<div class="wrapper">
    <div class="form-header">
        <div class="titles">
            <div class="title-login">VU-Sign up</VU-></div>
        </div>
    </div>


    <form id="signup-form" class="signup-form" autocomplete="off">
         <div class="input-box">
            <label for="firstname" class="label">First Name</label>
            <input 
                type="text" 
                placeholder="Enter your first name"
                class="input-field" 
                id="firstname"
                required
            >
            <i class="bx bx-user icon"></i>
        </div>

        <div class="input-box">
            <label for="lastname" class="label">Last Name</label>
            <input 
                type="text" 
                placeholder="Enter your last name"
                class="input-field" 
                id="lastname"
                required
            >
            <i class="bx bx-user icon"></i>
        </div>

        <div class="input-box">
            <label for="email" class="label">Email</label>
            <input 
                type="email" 
                placeholder="Enter your email"
                class="input-field" 
                id="email"
                required
                autocomplete="email"
            >
            <i class="bx bx-envelope icon"></i>
        </div>

        <div class="input-box">
            <label for="password" class="label">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="new-password"
                minlength="8"
                required
                class="input-field"
            >
            <i class="bx bx-arrow-in-right-square-half"></i> 
        </div>

      
        <br>
         
        <button id="signup-button" class="btn-submit" type="submit">
            Sign Up
        </button>
        <div class="switch-form">
    <span>
        Already have an account?
        <a href="login.html">Sign In</a>
    </span>
</div>
        
        <!-- Output display element for messages -->
        <p id="message" role="status"></p>
    </form> 
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="signup.js"></script>
</body>
</html>
