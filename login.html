<!DOCTYPE html>
<html lang="en">

<head> 
    <link rel="stylesheet" href="loginstyles.css">
    <meta charset="UTF-8"> 
    <meta http-equiv="X-UA-COMPATIBLE" content="IE=edge">
    <meta name="viewport" content="width=device.width, initial-scale=1.0">
    <title>
        Document
    </title> 
      
  
</head>



<body >

    


<div class="wrapper">

    <div class="form-header">

        <div class="titles">
            <div class="title-login">
        VU-Login
            </div>
        </div>

    </div>



    <form class="login-form" autocomplete="off">

        <div class="input-box">
             <label for="log-email" class="label">Email</label>
            <input type="text" class="input-field" id="log-email">
            <i class="bx bx-envelope icon"></i>
        </div>


         <div class="input-box">


            <label for="password" class="label">Password</label>
            <input type="password" class="input-field" id="password">
           <i class="bx bx-arrow-in-right-square-half"></i> 
        </div>


        <div class="form-cols">

        <div class="col-1"> </div>
            <div class="col-2"> 
                <a href="#"> Forgot Password?</a>
            </div>
         </div>

         

            <button id="signin-button" class="btn-submit" >
                Sign In
            </button>
    
         


         <div class="switch-form"> 
            <span>Don't have an account? <a class="sign-up" href="signup.html">Sign Up</a></span>
         </div>


    </form> 

</div>



       <script src="login.js"></script>
   
</body>
