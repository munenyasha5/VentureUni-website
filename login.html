<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="loginstyles.css">
    <meta charset="UTF-8"> 
    <meta http-equiv="X-UA-COMPATIBLE" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VU-Login</title> 

   
</head>


<body>
<div class="wrapper">
    <div class="form-header">
        <div class="titles">
            <div class="title-login">VU-Login</div>
        </div>
    </div>

    <!-- Added direct id="login-form" -->
    <form id="login-form" class="login-form" autocomplete="off">
        <div class="input-box">
            <label for="email" class="label">Email</label>
            <input 
                type="email" 
                placeholder="Enter your email"
                class="input-field" 
                id="email"
                required
                autocomplete="email"
            >
            <i class="bx bx-envelope icon"></i>
        </div>

        <div class="input-box">
            <label for="password" class="label">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                minlength="8"
                required
                class="input-field"
            >
            <i class="bx bx-arrow-in-right-square-half"></i> 
        </div>

        <div class="form-cols">
            <div class="col-1"></div>
            <div class="col-2"> 
                <a href="#"> Forgot Password?</a>
            </div>
        </div>
        <br>
         
        <button id="login-button" class="btn-submit" type="submit">
            Login
        </button>
    
        <br>
        <br>

        <div class="switch-form"> 
            <span>Don't have an account? <a class="sign-up" href="signup.html">Sign Up</a></span>
        </div>

        <!-- Output display element for messages -->
        <p id="message" role="status"></p>
    </form> 
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="login.js"></script>
</body>
</html>
